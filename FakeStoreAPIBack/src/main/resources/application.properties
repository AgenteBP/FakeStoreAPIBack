spring.application.name=FakeStoreAPIBack

# LOCAL
spring.datasource.url= jdbc:mysql://localhost:3306/DB_FAKE_STORE
spring.datasource.username= root
# spring.datasource.password

# MYSQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
# La clave se puede pisar con la variable de entorno JWT_SECRET (recomendado fuera de desarrollo)
jwt.secret=${JWT_SECRET:NOEvwP3KOmoMNn9Mv5iLL+U3ik2r98ga7wW4ODCqRFM=}
jwt.expiration-minutes=180

# Usuario ADMIN que se crea al arrancar si no existe ninguno
admin.email=admin@fakestore.com
admin.password=${ADMIN_PASSWORD:admin123}

# Avance simulado de las compras (lo aplica OrderStatusScheduler). Minutos en cada estado:
# PENDING -> PAID (si el cliente no pagó antes)
orders.payment-delay-minutes=3
# PAID -> SHIPPED
orders.shipping-delay-minutes=2
# SHIPPED -> DELIVERED
orders.delivery-delay-minutes=1

# admin@fakestore.com / admin123